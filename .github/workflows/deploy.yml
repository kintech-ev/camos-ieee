name: Deploy Cloudflare Pages

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  validate:
    name: Validate before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mandatory application gate
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --audit-level=high

  deploy:
    name: Deploy ${{ needs.target.outputs.environment }}
    needs: [validate, target]
    if: needs.target.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ needs.target.outputs.environment }}
      url: ${{ steps.pages.outputs.url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run check

      - name: Set deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "label=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "label=production" >> "$GITHUB_OUTPUT"
            else
              echo "label=staging" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Deploy to Cloudflare Pages
        id: pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_BRANCH: ${{ steps.target.outputs.branch }}
          DEPLOY_LABEL: ${{ steps.target.outputs.label }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo 'Missing CLOUDFLARE_PAGES_PROJECT variable.' >&2; exit 1; }
          deploy_args=(
            pages deploy dist
            --project-name "$CLOUDFLARE_PAGES_PROJECT"
            --commit-hash "$GITHUB_SHA"
            --commit-message "$DEPLOY_LABEL: $GITHUB_SHA"
          )
          if [[ "$DEPLOY_LABEL" != "production" ]]; then
            deploy_args+=(--branch "$DEPLOY_BRANCH")
          fi
          npx wrangler "${deploy_args[@]}"
          if [[ "$DEPLOY_LABEL" == "production" ]]; then
            echo "url=https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${DEPLOY_BRANCH}.${CLOUDFLARE_PAGES_PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish deployment URL
        run: |
          {
            echo "### Cloudflare Pages ${{ steps.target.outputs.label }} deployment"
            echo
            echo "- Environment: ${{ steps.target.outputs.label }}"
            echo "- Branch: ${{ steps.target.outputs.branch }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: ${{ steps.pages.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  target:
    name: Select deployment target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      should_deploy: ${{ steps.target.outputs.should_deploy }}
    steps:
      - name: Select environment
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "should_deploy=${{ github.event.pull_request.head.repo.full_name == github.repository }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi
