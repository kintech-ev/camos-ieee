name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages serves this repository as a project site under /<repo>/, so the build is
# given the repository-derived origin and base path instead of a hardcoded host.
env:
  PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
  PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mandatory application gate
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v5
